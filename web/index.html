<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>LinnStrument Light Guide</title>
  
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="./lib/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css?v=2" />

  <script src="./lib/bootstrap.bundle.min.js?v=2"></script>
  <script src="./lib/webmidi.iife.min.js"></script>
  <script src="./lib/JZZ.js"></script>
  <script src="./lib/JZZ.midi.SMF.js"></script>
  <script src="./src/main.js" type="module"></script>
</head>

<body>
  <div class="container py-3">
    <header>
      <div class="d-flex flex-column flex-md-row align-items-center pb-2 mb-3 border-bottom">
        <a href="https://fannon.github.io/linnstrument-light-guide/" class="d-flex align-items-center text-decoration-none">
          <title>LinnStrument Light Guide</title> 
          <span id="app-title">LinnStrument Light Guide <small class="text-muted">1.3.0</small></span>
        </a>

        <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
          <a class="me-3 text-decoration-none" target="_blank"
            href="https://github.com/Fannon/linnstrument-light-guide#linnstrument-light-guide-support">Documentation</a>
          <a class="me-3 text-decoration-none" target="_blank"
            href="https://www.kvraudio.com/forum/viewtopic.php?t=595693&sid=2f8c8f467ff70df44f7028e8f21bbbaf">KVR Forum Thread</a>
          <a class="me-3 text-decoration-none" target="_blank"
            href="https://github.com/Fannon/linnstrument-light-guide">GitHub</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="chassis">
      <div class="row text-left">
        <div class="col">
          <div class="instrument-panel">
            <div id="visualization"></div>
          </div>
        </div>
      </div>
      <div class="panel-groups">
        <div class="panel-group" style="--keys: 4">
          <div class="panel-group-title">Configuration</div>
          <div class="panel-group-keys">
            <button type="button" id="read-config" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Read the current layout, transposition and note light settings from the LinnStrument. Nothing is read until you press this.">Import</button>
            <button type="button" id="save" class="btn btn-success" data-bs-toggle="tooltip" data-bs-placement="top" title="Save the settings below and apply them.">Save</button>
            <button type="button" id="reset-config" class="btn btn-danger" data-bs-toggle="tooltip" data-bs-placement="top" title="Put the settings below back to their defaults.">Default</button>
            <button id="reset-state" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Resets all state (incl. highlights) on the visualization and the LinnStrument.">Reset</button>
          </div>
        </div>
        <div class="panel-group" style="--keys: 6">
          <div class="panel-group-title">Player <span id="midi-file-name" class="panel-group-value panel-group-value-name panel-group-value-over panel-group-value-over-start"></span><span id="player-speed" class="panel-group-value panel-group-value-over panel-group-value-over-end" style="--span: 2">100%</span></div>
          <div class="panel-group-keys">
            <input type="file" id="midiFile" accept=".mid,.midi" class="visually-hidden">
            <label for="midiFile" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Play a local MIDI file directly into the Light Guide. No virtual MIDI port needed.">Choose File</label>
            <div class="form-check" data-bs-toggle="tooltip" data-bs-placement="top" title="Step through the file instead of playing it in time: each set of notes stays lit until every one of them is held down.">
              <input class="form-check-input" type="checkbox" id="player-step">
              <label class="form-check-label" for="player-step">Stepwise</label>
            </div>
            <button id="player-play" type="button" class="btn btn-primary" disabled>Play</button>
            <button id="player-stop" type="button" class="btn btn-secondary" disabled>Stop</button>
            <button id="player-slower" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Play the file slower, down to a quarter of its tempo. Takes effect straight away, mid-song too. Step mode is paced by your playing, so speed does not apply there.">Slower</button>
            <button id="player-faster" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Play the file faster, up to twice its tempo. Takes effect straight away, mid-song too. Step mode is paced by your playing, so speed does not apply there.">Faster</button>
          </div>
        </div>
        <div class="panel-group" style="--keys: 2">
          <div class="panel-group-title">Statistics</div>
          <div class="panel-group-keys">
            <button id="calculate-statistics" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Calculates statistics on how the played notes compare against the Light Guide notes. This also happens automatically after some play breaks.">Calculate</button>
            <button id="clear-history" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Clears history, recordings and statistics.">Clear</button>
          </div>
        </div>
        <div class="panel-group" style="--keys: 1">
          <div class="panel-group-title">Log</div>
          <div class="panel-group-keys">
            <button id="clear-log" type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top" title="Clear the log below.">Clear</button>
          </div>
        </div>
      </div>
      </div>
      <div class="row text-left">
        <div class="col-3">
          <div class="card mb-3">
            <div class="card-header" data-bs-toggle="collapse" data-bs-target="#general-config" aria-expanded="true">General Configuration</div>
            <div class="card-body collapse show" id="general-config">
              <form>


                <label for="reversedSplits" class="form-label">Reversed Splits</label>
                <select id="reversedSplits" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Which splits left handed operation reverses (REV, REVL or REVR). Left handed operation is auto-detected, but the LinnStrument does not report which splits it applies to, so that is set here.">
                  <option value="both">Both (REV)</option>
                  <option value="left">Left only (REVL)</option>
                  <option value="right">Right only (REVR)</option>
                </select>

                <label for="showFeedback" class="form-label">Show play statistic feedback</label>
                <select id="showFeedback" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="If enabled, the feedback from comparing played notes with guide notes is shown on the visualization.">
                  <option value="0">Off</option>
                  <option value="1">On</option>
                </select>

                <label for="duplicateNotePads" class="form-label">Duplicate Note Pads</label>
                <select id="duplicateNotePads" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="The same note sits on several pads at once, and lighting all of them makes a chord hard to read. The other settings light only the pad nearest the middle, either one per split or one overall; any pad still plays the note.">
                  <option value="0">Light all of them</option>
                  <option value="1">Middle one, each side</option>
                  <option value="2">Middle one, one side</option>
                </select>

                <label for="partRouting" class="form-label">Route Parts To Hands</label>
                <select id="partRouting" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Light each note under the hand that plays its part, read from the file's tracks or channels rather than from pitch, so a melody dipping below the accompaniment stays in the right hand. Needs a split, and a file that keeps its parts apart.">
                  <option value="0">Off</option>
                  <option value="1">On</option>
                </select>

                <label for="guideHighlightColor" class="form-label">Light Guide Note Color</label>
                <select id="guideHighlightColor" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Color for Light Guide highlights on LinnStrument and visualization.">
                  <option value="7">Off</option>
                  <!-- <option value="0" selected>As set in Note Lights settings</option> -->
                  <option value="1">Red</option>
                  <option value="2">Yellow</option>
                  <option value="3">Green</option>
                  <option value="4">Cyan</option>
                  <option value="5">Blue</option>
                  <option value="6">Magenta</option>
                  <option value="8">White</option>
                  <option value="9">Orange</option>
                  <option value="10">Lime</option>
                  <option value="11">Pink</option>
                </select>

                <label for="stepHoldColor" class="form-label">Step: Held Note Color</label>
                <select id="stepHoldColor" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Step mode only. Color for a note that is not to be lifted, whether struck now or on an earlier step. The Light Guide color then means a note to strike and release. Off lights both the same.">
                  <option value="7">Off (use Light Guide color)</option>
                  <option value="1">Red</option>
                  <option value="2">Yellow</option>
                  <option value="3">Green</option>
                  <option value="4">Cyan</option>
                  <option value="5">Blue</option>
                  <option value="6">Magenta</option>
                  <option value="8">White</option>
                  <option value="9">Orange</option>
                  <option value="10">Lime</option>
                  <option value="11">Pink</option>
                </select>

                <label for="stepNextColor" class="form-label">Step: Next Step Color</label>
                <select id="stepNextColor" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Step mode only. Lights what the next step will strike, as a look ahead. These are not notes to play yet: the step does not wait for them and they do not count towards the statistics.">
                  <option value="7">Off (no look ahead)</option>
                  <option value="1">Red</option>
                  <option value="2">Yellow</option>
                  <option value="3">Green</option>
                  <option value="4">Cyan</option>
                  <option value="5">Blue</option>
                  <option value="6">Magenta</option>
                  <option value="8">White</option>
                  <option value="9">Orange</option>
                  <option value="10">Lime</option>
                  <option value="11">Pink</option>
                </select>

                <label for="stepErrorColor" class="form-label">Step: Wrongly Held Color</label>
                <select id="stepErrorColor" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Step mode only. Lights a pad you are holding that the current step has no note for, so you can see what to lift. The LinnStrument lights pads you touch with its own COLOR / PLAYED, so turn that off to see this.">
                  <option value="7">Off</option>
                  <option value="1">Red</option>
                  <option value="2">Yellow</option>
                  <option value="3">Green</option>
                  <option value="4">Cyan</option>
                  <option value="5">Blue</option>
                  <option value="6">Magenta</option>
                  <option value="8">White</option>
                  <option value="9">Orange</option>
                  <option value="10">Lime</option>
                  <option value="11">Pink</option>
                </select>

                <label for="stepFutureOutlines" class="form-label">Step: Next Step Outlines</label>
                <select id="stepFutureOutlines" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Step mode only, visualization only. Outlines each lit pad by what becomes of it on the next step: solid for a note held on, dashed for one struck again.">
                  <option value="0">Off</option>
                  <option value="1">On</option>
                </select>

                <label for="playedHighlightColor" class="form-label">Played Note Color</label>
                <select id="playedHighlightColor" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Color for pads you play, on the visualization only. 'As set on LinnStrument' reads the device's own COLOR / PLAYED setting.">
                  <option value="7">Off</option>
                  <option value="12">As set on LinnStrument</option>
                  <option value="1">Red</option>
                  <option value="2">Yellow</option>
                  <option value="3">Green</option>
                  <option value="4">Cyan</option>
                  <option value="5">Blue</option>
                  <option value="6">Magenta</option>
                  <option value="8">White</option>
                  <option value="9">Orange</option>
                  <option value="10">Lime</option>
                  <option value="11">Pink</option>
                </select>

                <label for="linnStrumentSize" class="form-label">LinnStrument Size</label>
                <select id="linnStrumentSize" class="form-select" data-bs-toggle="tooltip" data-bs-placement="right" title="Select size of your LinnStrument.">
                  <option selected>128</option>
                  <option>200</option>
                </select>

                <label for="delayedNoteThreshold" class="form-label">Delayed Note Threshold (ms)</label>
                <input id="delayedNoteThreshold" class="form-control text-end" type="text" placeholder="1" data-bs-toggle="tooltip" data-bs-placement="right" title="Below this timing offset, a note is considered in-time. Above, its considered early or late.">

                <label for="missedNoteThreshold" class="form-label">Missed Note Threshold (ms)</label>
                <input id="missedNoteThreshold" class="form-control text-end" type="text" placeholder="1" data-bs-toggle="tooltip" data-bs-placement="right" title="Above this timing offset, a note is consider a missed note.">

              </form>
            </div>
          </div>
        </div>
        <div class="col-3">
           <div class="card mb-3">
            <div class="card-header" data-bs-toggle="collapse" data-bs-target="#midi-config" aria-expanded="true">MIDI Port Configuration</div>
            <div class="card-body collapse show" id="midi-config">
              <form>
                <label for="instrumentInputPort" class="form-label"><strong>Input</strong>: Instrument</label>
                <select id="instrumentInputPort" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="Select your Instrument / LinnStrument MIDI Input port for receiving played notes.">
                  <option value=""></option>
                </select>

                <label for="instrumentOutputPort" class="form-label"><strong>Output</strong>: Instrument</label>
                <select id="instrumentOutputPort" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="Select your Instrument / LinnStrument MIDI Output port for sending guide note highlights and other MIDI requests to it (e.g. to sync layout).">
                  <option value=""></option>
                </select>

                <label for="lightGuideInputPort" class="form-label"><strong>Input</strong>: Light
                  Guide <small class="text-muted">(optional)</small></label>
                <select id="lightGuideInputPort" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="Select your Light Guide MIDI Input port for receiving guide notes. Usually this needs to be done via a virtual MIDI Loop port.">
                  <option value=""></option>
                </select>

                <label for="forwardPort1" class="form-label"><strong>Forward</strong>: MIDI Thru 1 <small
                    class="text-muted">(optional)</small>
                </label>
                <select id="forwardPort1" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="MIDI Thru port (1/2), where input from the instrument is forwarded to.">
                  <option value=""></option>
                </select>

                <label for="forwardPort2" class="form-label"><strong>Forward</strong>: MIDI Thru 2 <small
                    class="text-muted">(optional)</small></label>
                <select id="forwardPort2" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="MIDI Thru port (1/2), where input from the instrument is forwarded to.">
                  <option value=""></option>
                </select>

                <label for="instrumentInputPort2" class="form-label"><strong>Input</strong>: Instrument 2 <small
                    class="text-muted">(optional)</small></label>
                <select id="instrumentInputPort2" class="form-select" data-bs-toggle="tooltip" data-bs-placement="left" title="Optional second instrument input. This can be useful, e.g. when foot pedals are sent via own MIDI device.">
                  <option value=""></option>
                </select>
              </form>
            </div>
          </div>

        </div>
        <div class="col-6">
          <div class="card mb-3">
            <div class="card-header" data-bs-toggle="collapse" data-bs-target="#log-panel" aria-expanded="true">Logs <small class="text-muted">(most recent on top)</small>
            </div>
            <div class="card-body collapse show" id="log-panel">
              <div id="log"></div>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</body>

</html>
